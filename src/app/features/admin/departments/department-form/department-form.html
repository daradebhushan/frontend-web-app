<form (ngSubmit)="onSubmit()" class="flex flex-col space-y-4">
    <div *ngIf="error" class="bg-red-50 text-red-700 p-3 rounded text-sm">
        {{ error }}
    </div>

    <!-- English Name -->
    <div>
        <label for="deptName" class="block text-sm font-medium text-gray-700">Department Name (English) *</label>
        <div class="mt-1 flex rounded-md shadow-sm">
            <input type="text" name="name" id="deptName" [(ngModel)]="name" required
                class="flex-1 focus:ring-blue-500 focus:border-blue-500 block w-full min-w-0 rounded-md sm:text-sm border-gray-300 p-2 border"
                placeholder="e.g. Health Department">
        </div>
    </div>

    <!-- Marathi Name -->
    <div>
        <label for="deptNameMr" class="block text-sm font-medium text-gray-700">Department Name (Marathi) *</label>
        <div class="mt-1 flex rounded-md shadow-sm">
            <input type="text" name="nameMr" id="deptNameMr" [(ngModel)]="nameMr" required
                class="flex-1 focus:ring-blue-500 focus:border-blue-500 block w-full min-w-0 rounded-md sm:text-sm border-gray-300 p-2 border"
                placeholder="उदा. आरोग्य विभाग">
        </div>
    </div>

    <!-- Chatbot Toggle -->
    <div class="flex items-center">
        <input type="checkbox" id="chatbotEnabled" name="chatbotEnabled" [(ngModel)]="chatbotEnabled"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <label for="chatbotEnabled" class="ml-2 block text-sm text-gray-900">
            Enable in Chatbot
        </label>
    </div>

    <!-- Sub-Questions Management -->
    <div class="border-t pt-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Sub-Questions / Complaint Issues</label>

        <!-- List -->
        <ul class="space-y-2 mb-3">
            <li *ngFor="let q of subQuestions; let i = index"
                class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm">
                <span>{{q}}</span>
                <button type="button" (click)="removeSubQuestion(i)" class="text-red-500 hover:text-red-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </li>
        </ul>

        <!-- Add New -->
        <div class="flex gap-2">
            <input type="text" name="newSubQuestion" [(ngModel)]="newSubQuestion"
                class="flex-1 focus:ring-blue-500 focus:border-blue-500 block w-full min-w-0 rounded-md sm:text-sm border-gray-300 p-2 border"
                placeholder="Add new issue (Marathi)...">
            <button type="button" (click)="addSubQuestion()" [disabled]="!newSubQuestion.trim()"
                class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 disabled:opacity-50">
                Add
            </button>
        </div>
    </div>

    <div class="flex justify-end pt-4">
        <button type="submit" [disabled]="loading || !name || !nameMr"
            class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
            {{ (loading ? (department ? 'UPDATING' : 'CREATING') : (department ? 'UPDATE_DEPARTMENT' :
            'CREATE_DEPARTMENT')) | translate }}
        </button>
    </div>
</form>
