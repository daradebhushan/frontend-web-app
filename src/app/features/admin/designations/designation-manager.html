<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-900">Designations</h2>
    </div>

    <!-- Create Form -->
    <div class="bg-white p-6 rounded-lg shadow mb-6 border border-gray-200">
        <h3 class="text-lg font-semibold mb-4">Add Designation</h3>
        <div class="flex gap-4">
            <input type="text" [(ngModel)]="newDesignationName" placeholder="Designation Name (e.g. Chief Inspector)"
                class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            <button (click)="createDesignation()" [disabled]="!newDesignationName || loading"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">
                Add
            </button>
        </div>
        <p *ngIf="error" class="text-red-600 mt-2 text-sm">{{ error }}</p>
    </div>

    <!-- Designations List -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let des of designations">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ des.id }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ des.name }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button (click)="deleteDesignation(des.id)"
                            class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
                <tr *ngIf="designations.length === 0">
                    <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">No designations found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
