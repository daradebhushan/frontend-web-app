<div class="min-h-screen bg-[#F8FAFC] dark:bg-black font-sans pb-32 transition-colors duration-300">
    <!-- Header -->
    <div
        class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-white/10 px-6 py-4 transition-all duration-300">
        <div class="max-w-3xl mx-auto flex items-center space-x-4">
            <button [routerLink]="['/admin/complaint-types']"
                class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            <div>
                <div class="text-xs font-bold text-saffron-600 dark:text-saffron-400 uppercase tracking-widest mb-1">{{
                    isEditMode ? ('EDIT' | translate) : ('CREATE' | translate) }}</div>
                <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white tracking-tight">{{ 'COMPLAINT_TYPE' |
                    translate }}</h2>
            </div>
        </div>
    </div>

    <div class="max-w-3xl mx-auto p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

            <!-- Basics Card -->
            <div
                class="bg-white dark:bg-gray-900 p-8 rounded-[2rem] shadow-sm border border-gray-100 dark:border-gray-800">
                <div class="space-y-6">
                    <!-- Name -->
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Type
                            Name</label>
                        <input formControlName="name" type="text" placeholder="e.g. Street Light Failure"
                            class="w-full bg-cream-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-5 py-4 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-saffron-500/10 focus:border-saffron-500 transition-all font-medium">
                        <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
                            class="mt-2 text-xs text-red-500 font-bold">
                            Name is required
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Description</label>
                        <textarea formControlName="description" rows="3"
                            placeholder="Brief description of this complaint type..."
                            class="w-full bg-cream-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-5 py-4 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-saffron-500/10 focus:border-saffron-500 transition-all font-medium resize-none"></textarea>
                    </div>

                    <!-- Department -->
                    <div>
                        <label
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Assigned
                            Department</label>
                        <select formControlName="departmentId"
                            class="w-full bg-cream-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-5 py-4 text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-saffron-500/10 focus:border-saffron-500 transition-all font-medium appearance-none">
                            <option [ngValue]="null" disabled>Select Department</option>
                            <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</option>
                        </select>
                        <div *ngIf="form.get('departmentId')?.touched && form.get('departmentId')?.invalid"
                            class="mt-2 text-xs text-red-500 font-bold">
                            Department is required
                        </div>
                    </div>

                    <!-- Active Status -->
                    <div
                        class="flex items-center justify-between p-4 bg-cream-50 dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700">
                        <div>
                            <div class="font-bold text-gray-900 dark:text-white">{{ 'ACTIVE_STATUS' | translate }}</div>
                            <div class="text-xs text-gray-500">Enable or disable this complaint type</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" formControlName="isActive" class="sr-only peer">
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-saffron-300 dark:peer-focus:ring-saffron-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-saffron-600">
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="form.invalid || isLoading"
                class="w-full bg-saffron-600 hover:bg-saffron-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-saffron-500/20 transform active:scale-[0.98] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!isLoading">{{ isEditMode ? ('UPDATE' | translate) : ('CREATE' | translate) }}</span>
                <span *ngIf="isLoading" class="flex items-center justify-center space-x-2">
                    <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span>Saving...</span>
                </span>
            </button>
        </form>
    </div>
</div>
