<div
    class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-cream-50 to-gray-100 font-sans relative">

    <!-- Language Toggle (Top Right) -->
    <div class="absolute top-6 right-6 z-10">
        <app-language-toggle></app-language-toggle>
    </div>

    <!-- Top Emblem & Branding -->
    <div class="text-center mb-10 animate-fade-in-up">
        <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-md">
            <!-- Placeholder for Emblem/Ashoka Stambh -->
            <svg class="w-full h-full text-saffron-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L15 8H9L12 2Z" /> <!-- Simple Crown Mock -->
                <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
                <circle cx="12" cy="14" r="3" class="text-white" fill="white" />
            </svg>
        </div>

        <h1 class="text-4xl font-bold text-gray-900 mb-1 tracking-tight">{{ 'APP_TITLE' | translate }}</h1>
        <h2 class="text-lg font-semibold text-gray-600 uppercase tracking-widest">Nagar Parishad Administration</h2>
        <p class="text-sm text-gray-500 mt-1 font-medium">{{ 'APP_SUBTITLE' | translate }}</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-float p-8 border border-white/50 backdrop-blur-sm">
        <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">{{ 'SELECT_ROLE' | translate }}</h3>

        <div class="space-y-4">
            <!-- Role Cards -->
            <div *ngFor="let role of roles" (click)="selectRole(role.id)"
                class="relative overflow-hidden group border-2 rounded-2xl p-5 cursor-pointer transition-all duration-300 transform hover:-translate-y-1"
                [ngClass]="selectedRole === role.id ? 'border-saffron-500 bg-orange-50/50 shadow-md' : 'border-transparent bg-gray-50 hover:bg-white hover:shadow-soft'">

                <!-- Selection Indicator -->
                <div *ngIf="selectedRole === role.id" class="absolute top-4 right-4 text-saffron-600 animate-scale-in">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7">
                        </path>
                    </svg>
                </div>

                <div class="flex items-center space-x-4">
                    <!-- Icon Container -->
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center transition-colors duration-300"
                        [ngClass]="selectedRole === role.id ? 'bg-saffron-100 text-saffron-600' : 'bg-gray-200 text-gray-500 group-hover:bg-white group-hover:text-gray-700'">
                        <svg *ngIf="role.icon === 'shield'" class="w-6 h-6" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                            </path>
                        </svg>
                        <svg *ngIf="role.icon === 'building'" class="w-6 h-6" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                            </path>
                        </svg>
                        <svg *ngIf="role.icon === 'user'" class="w-6 h-6" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>

                    <div>
                        <div class="font-bold text-gray-900 leading-tight">{{ role.titleKey | translate }}</div>
                        <div class="text-xs text-gray-500 font-medium">{{ role.subTextKey | translate }}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Continue Button -->
        <button (click)="continue()" [disabled]="!selectedRole || loading"
            class="mt-8 w-full bg-saffron-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all duration-300 transform hover:shadow-saffron-500/30 hover:bg-saffron-700 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex justify-center items-center">
            <span *ngIf="loading" class="mr-2 animate-spin rounded-full h-5 w-5 border-b-2 border-white"></span>
            {{ loading ? ('PROCESSING' | translate) : ('CONTINUE_AS' | translate) }}
        </button>
    </div>

    <!-- Footer -->
    <div class="mt-auto pt-8 text-center opacity-60">
        <p class="text-xs text-gray-600 font-medium">{{ 'VERSION' | translate }}</p>
    </div>
</div>
