<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-cream-50 to-gray-100
dark:from-gray-900 dark:to-black font-sans relative dark:bg-black transition-colors duration-300">

  <!-- Language Toggle (Top Right) -->
  <div class="absolute top-6 right-6 z-10">
    <app-language-toggle></app-language-toggle>
  </div>

  <!-- Top Emblem & Branding -->
  <div class="text-center mb-10 animate-fade-in-up">
    <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-lg">
      <div class="absolute inset-0 bg-gradient-to-br from-saffron-400 to-saffron-600 rounded-full blur-xl opacity-30"></div>
      <div class="relative bg-white dark:bg-gray-800 rounded-full p-2 shadow-md border border-gray-100 dark:border-gray-700 flex items-center justify-center overflow-hidden w-full h-full">
        <img src="assets/loknagar-logo.png" alt="Loknagar Logo" class="w-full h-full object-contain" />
      </div>
    </div>

    <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-1 tracking-tight">{{ 'APP_TITLE' | translate }}</h1>
    <h2 class="text-lg font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-widest">{{ 'MARATHI_TITLE' |
      translate }}</h2>
    <p class="text-sm text-gray-500 dark:text-gray-500 mt-1 font-medium">{{ 'APP_SUBTITLE' | translate }}</p>
  </div>

  <!-- Login Card -->
  <div
    class="w-full max-w-md bg-white dark:bg-gray-900 rounded-3xl shadow-float p-8 border border-white/50 dark:border-white/10 backdrop-blur-sm animate-fade-in-up delay-100 transition-colors duration-300">
    <div class="mb-8 text-center">
      <h3 class="text-xl font-bold text-gray-800 dark:text-white">{{ 'LOGIN_HEADER' | translate }}</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ 'LOGIN_SUBTEXT' | translate }}</p>
    </div>

    <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email Input -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">{{ 'EMAIL_LABEL' |
          translate }}</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </div>
          <input id="email" type="email" formControlName="email" required
            class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-700 rounded-xl leading-5 bg-cream-50 dark:bg-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:bg-white dark:focus:bg-gray-900 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out"
            [placeholder]="'EMAIL_PLACEHOLDER' | translate">
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ 'PASSWORD_LABEL' |
            translate
            }}</label>
          <a routerLink="/forgot-password"
            class="text-sm font-medium text-saffron-600 hover:text-saffron-500 transition-colors duration-200">
            {{ 'FORGOT_PASSWORD' | translate }}
          </a>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input id="password" type="password" formControlName="password" required
            class="block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-700 rounded-xl leading-5 bg-cream-50 dark:bg-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:bg-white dark:focus:bg-gray-900 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out"
            [placeholder]="'PASSWORD_PLACEHOLDER_LOGIN' | translate">
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center">
        <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{ error }}
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" [disabled]="loading"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-saffron-600 hover:bg-saffron-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-saffron-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-0.5">
          <span *ngIf="loading" class="mr-2 animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
          {{ loading ? ('SIGNING_IN' | translate) : ('SIGN_IN_BUTTON' | translate) }}
        </button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div class="mt-auto pt-8 text-center opacity-60">
    <p class="text-xs text-gray-600 font-medium">{{ 'VERSION' | translate }}</p>
  </div>
</div>
