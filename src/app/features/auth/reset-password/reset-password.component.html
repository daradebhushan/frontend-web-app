<div
    class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-cream-50 to-gray-100 font-sans">

    <!-- Top Emblem & Branding -->
    <div class="text-center mb-10 animate-fade-in-up">
        <div class="w-24 h-24 mx-auto mb-4 relative drop-shadow-md">
            <svg class="w-full h-full text-saffron-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L15 8H9L12 2Z" />
                <path d="M4 8H20V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V8Z" opacity="0.8" />
                <circle cx="12" cy="14" r="3" class="text-white" fill="white" />
            </svg>
        </div>

        <h1 class="text-4xl font-bold text-gray-900 mb-1 tracking-tight">नगर परिषद प्रशासन</h1>
        <h2 class="text-lg font-semibold text-gray-600 uppercase tracking-widest">Nagar Parishad Administration</h2>
    </div>

    <!-- Reset Password Card -->
    <div
        class="w-full max-w-md bg-white rounded-3xl shadow-float p-8 border border-white/50 backdrop-blur-sm animate-fade-in-up delay-100">
        <div class="mb-8 text-center">
            <h3 class="text-xl font-bold text-gray-800">Reset Password</h3>
            <p class="text-sm text-gray-500 mt-1">
                {{ email ? 'Resetting password for ' + email : 'Enter your new password below.' }}
            </p>
        </div>

        <form class="space-y-6" [formGroup]="resetForm" (ngSubmit)="onSubmit()">

            <!-- OTP Input -->
            <div>
                <label for="otp" class="block text-sm font-medium text-gray-700 mb-1">Enter OTP</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.2-2.858.567-4.181m-3.23 12.166L8 12m-6 6l5-5" />
                        </svg>
                    </div>
                    <input id="otp" type="text" formControlName="otp" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out"
                        placeholder="6-digit OTP">
                </div>
                <div *ngIf="resetForm.get('otp')?.invalid && (resetForm.get('otp')?.dirty || resetForm.get('otp')?.touched)"
                    class="text-red-500 text-xs mt-1">
                    Enter a valid 6-digit OTP.
                </div>
            </div>

            <!-- New Password Input -->
            <div>
                <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input id="newPassword" type="password" formControlName="newPassword" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out"
                        placeholder="New Password">
                </div>
                <div *ngIf="resetForm.get('newPassword')?.invalid && (resetForm.get('newPassword')?.dirty || resetForm.get('newPassword')?.touched)"
                    class="text-red-500 text-xs mt-1">
                    Password must be at least 6 characters long.
                </div>
            </div>

            <!-- Confirm Password Input -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm
                    Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input id="confirmPassword" type="password" formControlName="confirmPassword" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 sm:text-sm transition duration-150 ease-in-out"
                        placeholder="Confirm Password">
                </div>
                <div *ngIf="resetForm.hasError('mismatch') && (resetForm.get('confirmPassword')?.dirty || resetForm.get('confirmPassword')?.touched)"
                    class="text-red-500 text-xs mt-1">
                    Passwords do not match.
                </div>
            </div>


            <!-- Messages -->
            <div *ngIf="error" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center">
                <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                {{ error }}
            </div>

            <div *ngIf="success" class="bg-green-50 text-green-600 text-sm p-3 rounded-lg flex items-center">
                <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                {{ success }}
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" [disabled]="loading || resetForm.invalid || !email"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-saffron-600 hover:bg-saffron-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-saffron-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-0.5">
                    <span *ngIf="loading" class="mr-2 animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
                    {{ loading ? 'Resetting...' : 'Reset Password' }}
                </button>
            </div>

            <div class="text-center mt-4">
                <a routerLink="/login" class="text-sm text-saffron-600 hover:text-saffron-500 font-medium">Back to
                    Login</a>
            </div>
        </form>
    </div>
</div>
